name: release

# Chạy test ở mỗi lần push. Push một tag như v1.0.1, hoặc bấm "Run workflow" trong
# tab Actions, thì dựng thêm bộ cài và bản portable rồi đăng GitHub Release
# v<version trong package.json>.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download the bundled ImageMagick
        run: npm run fetch:magick
      - name: Put the bundled ImageMagick on PATH for the tests
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\vendor\imagemagick"
      - name: Install Ghostscript for the PDF tests
        run: choco install ghostscript --no-progress -y
      - run: npm run build
      - run: npm run test:unit
      - name: Build installer and portable zip
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        run: npx electron-builder --win nsis zip --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release notes and SHA-256 checksums
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Lấy ghi chú trong docs/release-notes/v<version>.md, điền link bản dựng và mã SHA-256.
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $notes = "docs/release-notes/$tag.md"
          if (-not (Test-Path $notes)) { Write-Host "No $notes; the release text is left as it is."; exit 0 }
          $files = Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe', '.zip' } | Sort-Object Name -Descending
          $sums = $files | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          $setup = $files | Where-Object { $_.Extension -eq '.exe' } | Select-Object -First 1
          $body = Get-Content $notes -Raw -Encoding UTF8
          $body = $body.Replace('{{BUILD_URL}}', "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID")
          $body = $body.Replace('{{SETUP_SHA256}}', (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower())
          $body = $body.Replace('{{SHA256}}', ($sums -join "`n"))
          $file = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [IO.File]::WriteAllText($file, $body, (New-Object System.Text.UTF8Encoding $false))
          gh release edit $tag --title "Image Studio $version" --notes-file $file
