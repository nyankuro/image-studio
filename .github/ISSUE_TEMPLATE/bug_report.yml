name: Bug report / Báo lỗi
description: Something doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened? / Chuyện gì xảy ra?
      description: Steps to reproduce, what you expected, and what you saw. Screenshots help a lot.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version / Phiên bản
      description: Shown at the bottom left of the app (click it for About).
      placeholder: "1.0.0"
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: input
    id: file
    attributes:
      label: File type (if related) / Loại tệp
      placeholder: HEIC photo, PDF with 20 pages, ...
